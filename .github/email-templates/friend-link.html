<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>友链申请通知</title>
</head>
<body>
  <h2>新的友链申请</h2>
  <table>
    <tr>
      <td>GitHub 用户</td>
      <td>{{username}}</td>
    </tr>
    <tr>
      <td>站点名称</td>
      <td>{{site_name}}</td>
    </tr>
    <tr>
      <td>站点描述</td>
      <td>{{site_description}}</td>
    </tr>
    <tr>
      <td>站点 URL</td>
      <td><a href="{{site_url}}">{{site_url}}</a></td>
    </tr>
    <tr>
      <td>站点图标</td>
      <td><img src="{{site_icon}}" width="64" height="64" alt="icon" /></td>
    </tr>
  </table>
  <p>
    <a href="{{issue_url}}">查看 Issue</a>
  </p>
</body>
</html>
