version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    versioning-strategy: "auto"
    groups:
      astro-ecosystem:
        patterns:
          - "@astrojs/*"
          - "astro"
      iconify:
        patterns:
          - "@iconify-json/*"
      swup:
        patterns:
          - "@swup/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"