name: 友链申请邮件通知

on:
  issues:
    types: [opened]

jobs:
  send-email:
    name: 发送邮件通知
    if: contains(github.event.issue.body, '### 站点名称')
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 nodemailer
        run: npm install nodemailer

      - name: 解析 Issue 并发送邮件
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const nodemailer = require('nodemailer');

            // 从 issue body 中解析字段
            const body = context.payload.issue.body || '';
            const username = context.payload.issue.user.login;
            const issueUrl = context.payload.issue.html_url;

            function extractField(text, fieldName) {
              const regex = new RegExp(`### ${fieldName}\\s*\\n\\s*(.*?)(?=\\n### |\\n## |$)`, 's');
              const match = text.match(regex);
              return match ? match[1].trim() : '';
            }

            const siteName = extractField(body, '站点名称');
            const siteDescription = extractField(body, '站点描述');
            const siteUrl = extractField(body, '站点 URL');
            const siteIcon = extractField(body, '站点图标 URL');

            // 读取邮件模板
            let template = fs.readFileSync('.github/email-templates/friend-link.html', 'utf-8');

            // 替换占位符
            template = template.replace(/\{\{username\}\}/g, username);
            template = template.replace(/\{\{site_name\}\}/g, siteName);
            template = template.replace(/\{\{site_description\}\}/g, siteDescription);
            template = template.replace(/\{\{site_url\}\}/g, siteUrl);
            template = template.replace(/\{\{site_icon\}\}/g, siteIcon);
            template = template.replace(/\{\{issue_url\}\}/g, issueUrl);

            // 配置 SMTP
            const transporter = nodemailer.createTransport({
              host: 'smtp.163.com',
              port: 465,
              secure: true,
              auth: {
                user: process.env.ISSUES_SEND_EMAIL,
                pass: process.env.ISSUES_SEND_EMAIL_PASSWORD,
              },
            });

            // 收件人列表
            const recipients = process.env.ISSUES_EMAIL_RECIPIENTS;

            // 发送邮件
            await transporter.sendMail({
              from: process.env.ISSUES_SEND_EMAIL,
              to: recipients,
              subject: `🔔 新的友链申请 - ${siteName}`,
              html: template,
            });

            console.log(`邮件已发送给: ${recipients}`);
        env:
          ISSUES_SEND_EMAIL: ${{ secrets.ISSUES_SEND_EMAIL }}
          ISSUES_SEND_EMAIL_PASSWORD: ${{ secrets.ISSUES_SEND_EMAIL_PASSWORD }}
          ISSUES_EMAIL_RECIPIENTS: ${{ secrets.ISSUES_EMAIL_RECIPIENTS }}
