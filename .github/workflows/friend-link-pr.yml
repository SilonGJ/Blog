name: 友链自动创建 PR

on:
  issues:
    types: [closed]

jobs:
  create-pr:
    name: 创建友链 PR
    if: |
      github.event.issue.state_reason == 'completed' &&
      contains(github.event.issue.body, '### 站点名称')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析 Issue 内容
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            function extractField(text, fieldName) {
              const regex = new RegExp(`### ${fieldName}\\s*\\n\\s*(.*?)(?=\\n### |\\n## |$)`, 's');
              const match = text.match(regex);
              return match ? match[1].trim() : '';
            }

            const siteName = extractField(body, '站点名称');
            const siteDescription = extractField(body, '站点描述');
            const siteUrl = extractField(body, '站点 URL');
            const siteIcon = extractField(body, '站点图标 URL');

            core.setOutput('site_name', siteName);
            core.setOutput('site_description', siteDescription);
            core.setOutput('site_url', siteUrl);
            core.setOutput('site_icon', siteIcon);

      - name: 创建分支并修改配置
        run: |
          SITE_NAME="${{ steps.parse.outputs.site_name }}"
          SITE_URL="${{ steps.parse.outputs.site_url }}"
          SITE_ICON="${{ steps.parse.outputs.site_icon }}"
          SITE_DESCRIPTION="${{ steps.parse.outputs.site_description }}"
          BRANCH_NAME="friend-link/${SITE_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH_NAME}"

          # 使用 Node.js 修改 config.ts
          node << 'SCRIPT'
          const fs = require('fs');
          let content = fs.readFileSync('src/config.ts', 'utf-8');

          const siteName = `${{ steps.parse.outputs.site_name }}`;
          const siteUrl = `${{ steps.parse.outputs.site_url }}`;
          const siteIcon = `${{ steps.parse.outputs.site_icon }}`;
          const siteDescription = `${{ steps.parse.outputs.site_description }}`;

          function escapeStr(s) {
            return s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
          }

          const newEntry =
            `        {\n` +
            `          name: '${escapeStr(siteName)}',\n` +
            `          url: '${escapeStr(siteUrl)}',\n` +
            `          icon: '${escapeStr(siteIcon)}',\n` +
            `          description: '${escapeStr(siteDescription)}',\n` +
            `        },`;

          // 在 links 数组的最后一条记录之后、数组结束符之前插入
          const linksEndRegex = /(\s*\],\s*\n\s*\}\s*,\s*\n\s*\]\s*,)/;
          content = content.replace(linksEndRegex, '\n' + newEntry + '\n$1');

          fs.writeFileSync('src/config.ts', content);
          console.log('已添加友链:', siteName);
          SCRIPT

      - name: 提交并推送
        run: |
          SITE_NAME="${{ steps.parse.outputs.site_name }}"
          BRANCH_NAME="friend-link/${SITE_NAME}"

          git add src/config.ts
          git commit -m "feat: 添加友链 - ${SITE_NAME}"
          git push origin --delete "${BRANCH_NAME}" 2>/dev/null || true
          git push origin "${BRANCH_NAME}"

      - name: 创建 PR
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SITE_NAME="${{ steps.parse.outputs.site_name }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"

          PR_URL=$(gh pr create \
            --title "[友链] ${SITE_NAME}" \
            --label "friend link" \
            --body "Closes #${ISSUE_NUMBER}")

          PR_NUMBER=$(echo "$PR_URL" | grep -oP '\d+$')
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: 启用自动合并
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pr_number }} --auto --merge

      - name: 触发部署
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref master
