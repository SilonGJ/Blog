name: 友链自动合并 PR

on:
  pull_request:
    types: [opened, reopened]

jobs:
  auto-merge:
    name: 自动合并友链 PR
    if: contains(github.event.pull_request.labels.*.name, 'friend-link')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 启用自动合并
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --merge
