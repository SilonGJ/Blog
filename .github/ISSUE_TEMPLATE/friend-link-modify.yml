name: 修改友链
description: 修改您已有的友链信息（需先通过域名所有权验证）
labels: ["friend link modify"]
body:
  - type: input
    id: old-issue
    attributes:
      label: 旧ISSUE号
      description: 该友链最近一次申请/修改时的 issue 编号（即当前友链文件使用的编号）
      placeholder: "例：5"
    validations:
      required: true
  - type: input
    id: site-name
    attributes:
      label: 站点名称
      description: 修改后的站点名称（直接覆盖旧值）
      placeholder: "例：我的小站"
    validations:
      required: true
  - type: input
    id: site-description
    attributes:
      label: 站点描述
      description: 修改后的站点描述（直接覆盖旧值）
      placeholder: "例：一个记录生活和技术的博客"
    validations:
      required: true
  - type: input
    id: site-url
    attributes:
      label: 站点 URL
      description: 修改后的站点地址（直接覆盖旧值）
      placeholder: "例：https://example.com"
    validations:
      required: true
  - type: input
    id: site-icon
    attributes:
      label: 站点图标 URL
      description: 修改后的站点图标地址（留空则保留现有图标）
      placeholder: "例：https://example.com/favicon.ico"
    validations:
      required: false
  - type: input
    id: verify-address
    attributes:
      label: 友链检查地址
      description: 已添加本站友链的页面地址（直接覆盖旧值）
      placeholder: "例：https://example.com/links"
    validations:
      required: true